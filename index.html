<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Solver</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: Arial, sans-serif; height: 100dvh; overflow: hidden; }

    /* ── Camera ── */
    #camera-view { position: relative; width: 100%; height: 100dvh; }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #capture-canvas { display: none; }

    #aim-box {
      position: absolute;
      top: 37%;
      left: 50%;
      width: min(36vw, 170px);
      aspect-ratio: 3 / 2;
      transform: translate(-50%, -50%);
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
      transition: border 0.4s;
    }
    #aim-label {
      position: absolute;
      top: calc(100% + 12px);
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }

    /* ── Language selector ── */
    #lang-select {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.65); color: #fff;
      border: 1px solid rgba(255,255,255,0.35); border-radius: 8px;
      padding: 7px 10px; font-size: 14px; cursor: pointer; z-index: 10;
      -webkit-appearance: none; appearance: none;
    }
    #lang-select option { background: #111; color: #fff; }

    /* ── Scan button ── */
    #scan-btn {
      position: absolute;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      background: #fff; color: #000;
      border: none; border-radius: 50%;
      width: 72px; height: 72px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: transform 0.1s; z-index: 60;
    }
    #scan-btn:active { transform: translateX(-50%) scale(0.92); }
    #scan-btn:disabled { background: #888; cursor: default; }

    /* ── Analyzing overlay ── */
    #analyzing-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 30;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #333; border-top-color: #00ff88;
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #analyzing-label { font-size: 16px; font-weight: 600; }

    /* ── Error panel ── */
    #error-panel {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.93); z-index: 110;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 32px; text-align: center;
    }
    #error-panel h2 { font-size: 22px; color: #f87171; }
    #error-msg { color: #aaa; font-size: 15px; line-height: 1.6; max-width: 320px; }
    #error-back-btn {
      background: #fff; color: #000; border: none; border-radius: 24px;
      padding: 12px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
    }

    /* ── Results bottom sheet ── */
    #results-panel {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      max-height: 48dvh;
      background: #111;
      border-radius: 18px 18px 0 0;
      border-top: 1px solid #2a2a2a;
      z-index: 50;
      flex-direction: column;
      overflow: hidden;
    }
    #results-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #results-title { font-size: 14px; font-weight: 600; color: #bbb; }
    #clear-btn {
      background: none; border: none; color: #f87171;
      font-size: 13px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }
    #results-list {
      flex: 1; overflow-y: auto;
      padding: 10px 14px 90px;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* ── Cards ── */
    .answer-card {
      background: #1c1c1e; border-radius: 12px;
      padding: 11px 14px 11px 16px;
      border-left: 4px solid var(--c, #555);
      display: flex; flex-direction: column; gap: 5px;
      animation: cardIn 0.3s ease forwards;
      flex-shrink: 0;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .card-meta { display: flex; align-items: center; gap: 7px; }
    .card-dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #555); flex-shrink: 0; }
    .card-dir  { font-size: 18px; line-height: 1; }
    .card-clue { font-size: 13px; color: #888; line-height: 1.4; }
    .card-answers { font-size: 13px; color: #ddd; line-height: 1.7; }
    .card-len  { color: #4ade80; font-weight: 700; margin-right: 4px; }
    .msg-card {
      text-align: center; color: #666; font-size: 14px;
      padding: 12px 16px; border-radius: 10px; background: #1a1a1a;
      animation: cardIn 0.3s ease forwards; flex-shrink: 0;
    }

    /* ── Version ── */
    #version {
      position: fixed; bottom: 6px; left: 10px;
      font-size: 10px; color: rgba(255,255,255,0.25);
      z-index: 300; pointer-events: none; font-family: monospace;
    }
  </style>
</head>
<body>

  <div id="camera-view">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>
    <div id="aim-box">
      <span id="aim-label">Aim at a clue cell, then tap SCAN</span>
    </div>
    <select id="lang-select"></select>
    <button id="scan-btn">SCAN</button>
  </div>

  <div id="analyzing-overlay">
    <div class="spinner"></div>
    <div id="analyzing-label">Analyzing…</div>
  </div>

  <div id="error-panel">
    <h2>Error</h2>
    <p id="error-msg"></p>
    <button id="error-back-btn">↩ Try Again</button>
  </div>

  <div id="results-panel">
    <div id="results-header">
      <span id="results-title">Results</span>
      <button id="clear-btn">Clear all</button>
    </div>
    <div id="results-list"></div>
  </div>

  <div id="version">v0.29</div>

  <script>
  const ANALYZE_CELL_URL = 'https://us-central1-puzzl123.cloudfunctions.net/analyzeCell';
  const LS_LANG = 'puzzl_lang';

  const DIR_ARROW = {
    'left':'←','right':'→','down':'↓',
    'down-left':'↙','left-down':'↙',
    'down-right':'↘','right-down':'↘',
  };
  const LANGUAGES = [
    { code:'heb', label:'עברית' },
    { code:'eng', label:'English' },
    { code:'ara', label:'عربي' },
    { code:'spa', label:'Español' },
    { code:'fra', label:'Français' },
    { code:'deu', label:'Deutsch' },
    { code:'rus', label:'Русский' },
    { code:'tur', label:'Türkçe' },
  ];

  const $ = id => document.getElementById(id);
  const video            = $('video');
  const captureCanvas    = $('capture-canvas');
  const aimBox           = $('aim-box');
  const scanBtn          = $('scan-btn');
  const analyzingOverlay = $('analyzing-overlay');
  const errorPanel       = $('error-panel');
  const errorMsg         = $('error-msg');
  const errorBackBtn     = $('error-back-btn');
  const resultsList      = $('results-list');
  const resultsPanel     = $('results-panel');
  const clearBtn         = $('clear-btn');
  const langSelect       = $('lang-select');

  let lastCropDataUrl = null;
  const CARD_COLOR = '#22c55e';

  // ── Camera ──────────────────────────────────────────────────────────────────
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ ideal:'environment' }, width:{ ideal:3840, min:1280 }, height:{ ideal:2160, min:720 } },
        audio: false,
      });
      video.srcObject = stream;

      // Enable continuous autofocus if the device supports it
      const track = stream.getVideoTracks()[0];
      const caps  = track.getCapabilities?.() || {};
      if (caps.focusMode?.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
    } catch (err) { alert('Camera unavailable: ' + err.message); }
  }

  // Crop the aim-box directly from the video element.
  // Drawing from <video> guarantees coordinates match the display —
  // avoids rotation/aspect-ratio mismatches with ImageCapture photos.
  function cropAimBoxBase64() {
    const boxRect = aimBox.getBoundingClientRect();
    const vidRect = video.getBoundingClientRect();

    const streamW = video.videoWidth  || 1280;
    const streamH = video.videoHeight || 720;
    const dispW   = vidRect.width;
    const dispH   = vidRect.height;

    // object-fit: cover scale
    const coverScale = Math.max(dispW / streamW, dispH / streamH);
    const offX = (dispW - streamW * coverScale) / 2;
    const offY = (dispH - streamH * coverScale) / 2;

    // Aim-box in stream pixel coords
    const relX = boxRect.left - vidRect.left;
    const relY = boxRect.top  - vidRect.top;
    const sX = Math.max(0, (relX - offX) / coverScale);
    const sY = Math.max(0, (relY - offY) / coverScale);
    const sW = Math.min(boxRect.width  / coverScale, streamW - sX);
    const sH = Math.min(boxRect.height / coverScale, streamH - sY);

    const MIN_PX = 480;
    const upscale = Math.max(1, MIN_PX / Math.min(sW, sH));
    const outW = Math.round(sW * upscale);
    const outH = Math.round(sH * upscale);

    const tmp = document.createElement('canvas');
    tmp.width = outW; tmp.height = outH;
    const ctx = tmp.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, outW, outH);
    ctx.drawImage(video, sX, sY, sW, sH, 0, 0, outW, outH);

    lastCropDataUrl = tmp.toDataURL('image/jpeg', 0.95);
    return lastCropDataUrl.split(',')[1];
  }

  // ── Gemini call ─────────────────────────────────────────────────────────────
  async function callGeminiVision(imageBase64) {
    const resp = await fetch(ANALYZE_CELL_URL, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ imageBase64, rightLength: 0, downLength: 0, language: langSelect.value }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    return resp.json();
  }

  // ── UI helpers ───────────────────────────────────────────────────────────────
  function flashAimBox(ok) {
    aimBox.style.border = `2px solid ${ok ? '#4ade80' : '#f87171'}`;
    setTimeout(() => { aimBox.style.border = ''; }, 700);
  }

  function cropThumb() {
    if (!lastCropDataUrl) return '';
    return `<img src="${lastCropDataUrl}" style="width:100%;max-height:80px;object-fit:contain;border-radius:6px;margin-bottom:4px;background:#000;">`;
  }

  function makeAnswerCard(clue, direction, answers, color) {
    const card = document.createElement('div');
    card.className = 'answer-card';
    card.style.cssText = `--c:${color}`;
    const arrow = DIR_ARROW[direction] || direction || '?';

    const byLen = {};
    for (const a of answers) {
      const len = [...a].length;
      (byLen[len] = byLen[len] || []).push(a);
    }
    const answerHtml = Object.entries(byLen)
      .sort(([a], [b]) => a - b)
      .map(([len, words]) => `<div class="card-answers"><span class="card-len">${len}:</span>${words.join(' • ')}</div>`)
      .join('') || '<div class="card-answers" style="color:#666">No answer found</div>';

    card.innerHTML =
      cropThumb() +
      `<div class="card-meta"><div class="card-dot"></div><span class="card-dir">${arrow}</span></div>` +
      `<div class="card-clue">${clue || ''}</div>` +
      answerHtml;
    return card;
  }

  function makeMsgCard(text) {
    const el = document.createElement('div');
    el.className = 'msg-card';
    el.innerHTML = cropThumb() + `<span>${text}</span>`;
    return el;
  }

  function showResult(items) {
    if (!Array.isArray(items) || items.length === 0) {
      flashAimBox(false);
      resultsList.prepend(makeMsgCard('No clue found — try again.'));
      resultsPanel.style.display = 'flex';
      return;
    }
    flashAimBox(true);
    for (const { clue, direction, answers } of [...items].reverse()) {
      resultsList.prepend(makeAnswerCard(clue, direction, answers || [], CARD_COLOR));
    }
    resultsPanel.style.display = 'flex';
  }

  // ── Pipeline ─────────────────────────────────────────────────────────────────
  async function runPipeline() {
    scanBtn.disabled = true;
    errorPanel.style.display = 'none';
    analyzingOverlay.style.display = 'flex';

    try {
      const b64  = cropAimBoxBase64();
      const data = await callGeminiVision(b64);
      showResult(data);
    } catch (err) {
      errorMsg.textContent = err.message;
      errorPanel.style.display = 'flex';
    } finally {
      analyzingOverlay.style.display = 'none';
      scanBtn.disabled = false;
    }
  }

  // ── Language ─────────────────────────────────────────────────────────────────
  function initLangSelector() {
    const saved = localStorage.getItem(LS_LANG) || 'heb';
    LANGUAGES.forEach(({ code, label }) => {
      const opt = document.createElement('option');
      opt.value = code; opt.textContent = label;
      if (code === saved) opt.selected = true;
      langSelect.appendChild(opt);
    });
    langSelect.addEventListener('change', () => localStorage.setItem(LS_LANG, langSelect.value));
  }

  // ── Events ───────────────────────────────────────────────────────────────────
  scanBtn.addEventListener('click', runPipeline);

  clearBtn.addEventListener('click', () => {
    resultsList.innerHTML = '';
    resultsPanel.style.display = 'none';
  });

  errorBackBtn.addEventListener('click', () => { errorPanel.style.display = 'none'; });

  // ── Boot ─────────────────────────────────────────────────────────────────────
  initLangSelector();
  startCamera();
  </script>
</body>
</html>
